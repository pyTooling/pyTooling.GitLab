# A configuration with workflow rules and job rules of every form.
workflow:
  name: "Pipeline for $CI_COMMIT_REF_NAME"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
      when: never
    - when: always

docs:
  script: make docs
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - doc/**/*
        - README.md
    - changes:
        paths: [src/**/*]
        compare_to: refs/heads/main
      when: manual
      allow_failure: true
    - exists:
        paths: [Dockerfile]
      variables:
        IMAGE: docker
        RETRIES: 3
